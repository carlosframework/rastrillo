{{define "content"}}
{{template "page-header" dict "Title" .Title "Sub" .Sub}}
<div class="blog-status">
{{template "status-pill" dict "Tone" .StatusTone "Label" .StatusLabel}}
{{if .Published}}
<form method="post" action="/admin/posts/{{.ID}}/unpublish"><button class="rst-btn" type="submit">Unpublish</button></form>
<a class="rst-btn" href="/posts/{{.ID}}">View</a>
{{else}}
<form method="post" action="/admin/posts/{{.ID}}/publish"><button class="rst-btn" type="submit">Publish</button></form>
{{end}}
<form method="post" action="/admin/posts/{{.ID}}/delete"><button class="rst-btn" type="submit">Delete</button></form>
</div>
{{if .Error}}<p class="blog-error" role="alert">{{.Error}}</p>{{end}}
<form class="blog-form" method="post" action="{{.Action}}">
<label for="title">Title</label>
<input type="text" id="title" name="title" value="{{.FormTitle}}" required>
<label for="body">Body</label>
<textarea id="body" name="body" rows="18">{{.Body}}</textarea>
<div class="blog-form__actions">
<button class="rst-btn rst-btn--primary" type="submit">Save</button>
<a class="rst-btn" href="/admin/posts">Back to posts</a>
</div>
</form>
{{end}}
