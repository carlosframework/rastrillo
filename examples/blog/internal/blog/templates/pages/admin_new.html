{{define "content"}}
{{template "page-header" dict "Title" "New post" "Sub" "It starts as a draft — nothing is public until you publish it."}}
{{if .Error}}<p class="blog-error" role="alert">{{.Error}}</p>{{end}}
<form class="blog-form" method="post" action="{{.Action}}">
<label for="title">Title</label>
<input type="text" id="title" name="title" value="{{.FormTitle}}" required>
<label for="body">Body</label>
<textarea id="body" name="body" rows="18">{{.Body}}</textarea>
<div class="blog-form__actions">
<button class="rst-btn rst-btn--primary" type="submit">Create post</button>
<a class="rst-btn" href="/admin/posts">Cancel</a>
</div>
</form>
{{end}}
