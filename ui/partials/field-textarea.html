{{/* field-textarea — field's envelope around a plain scrolling
     <textarea>. No autosize: growing a textarea with input costs
     JavaScript, and this package's zero-JS baseline says a fixed Rows
     and a scrollbar beat a script tag.
     Keys:
       ID, Name, Label  strings, required
       Value, Placeholder  strings, optional
       Rows      string, optional — default "3"
       Maxlength string, optional
       Required  bool, optional
       Autofocus bool, optional — a dedicated create page's first field only
       Hint      string, optional — quiet parenthetical after the label
       Help      string, optional — the line under the control
       Error     string, optional — validation message */}}
{{define "field-textarea"}}<div class="rst-field"><label class="rst-field__label" for="{{.ID}}">{{.Label}}{{with .Hint}} <span class="rst-field__hint">({{.}})</span>{{end}}</label>
<textarea class="rst-input" id="{{.ID}}" name="{{.Name}}" rows="{{or .Rows "3"}}"{{with .Placeholder}} placeholder="{{.}}"{{end}}{{if .Required}} required{{end}}{{if .Autofocus}} autofocus{{end}}{{with .Maxlength}} maxlength="{{.}}"{{end}}{{if .Error}} aria-invalid="true" aria-describedby="{{.ID}}-error"{{else if .Help}} aria-describedby="{{.ID}}-help"{{end}}>{{or .Value ""}}</textarea>
{{if .Error}}<p class="rst-field__error" id="{{.ID}}-error" role="alert">{{.Error}}</p>
{{else if .Help}}<p class="rst-field__help" id="{{.ID}}-help">{{.Help}}</p>
{{end}}</div>{{end}}
